
name: NOVA IPTV - Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NOVA IPTV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "NOVA_IPTV/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=NOVA_IPTV" >> "$GITHUB_ENV"
          else
            echo "::error::Android project not found"
            ls -la
            exit 1
          fi

      - name: Check project files
        run: |
          echo "Project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon clean assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA_IPTV-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
