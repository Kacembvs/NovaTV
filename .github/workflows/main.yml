name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project layout
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and unit test
        run: ./gradlew clean assembleDebug testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-iptv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Stable phone-friendly link:
      # https://github.com/<owner>/<repo>/releases/download/latest-debug/nova-iptv-debug.apk
      - name: Publish "latest-debug" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk nova-iptv-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug nova-iptv-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "NOVA IPTV - debug (${GITHUB_SHA::7})" \
            --notes "APK debug compilé automatiquement depuis le commit ${GITHUB_SHA}."
