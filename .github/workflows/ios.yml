name: iOS build

on:
  push:
    branches: [ main, master ]
    paths: [ 'ios/**', '.github/workflows/ios.yml' ]
  pull_request:
    paths: [ 'ios/**', '.github/workflows/ios.yml' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select the newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Unit tests (simulator)
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          xcodebuild test -project NovaTV.xcodeproj -scheme NovaTV -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO | tee test.log | grep -E "error:|warning: .*NovaTV|Test Case|Executed|BUILD" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project NovaTV.xcodeproj -scheme NovaTV -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NovaTV.app Payload/
          zip -qry nova-ios-unsigned.ipa Payload
          ls -lh nova-ios-unsigned.ipa

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ios/build.log
            ios/test.log
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nova-ios-unsigned-ipa
          path: ios/nova-ios-unsigned.ipa
          if-no-files-found: error

      # Stable link: https://github.com/<owner>/<repo>/releases/download/latest-ios/nova-ios-unsigned.ipa
      - name: Publish "latest-ios" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-ios --yes --cleanup-tag || true
          gh release create latest-ios nova-ios-unsigned.ipa \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "NOVA iOS - IPA non signée (${GITHUB_SHA::7})" \
            --notes "IPA non signée compilée depuis ${GITHUB_SHA}. À installer avec Sideloadly ou AltStore (identifiant Apple gratuit)."
