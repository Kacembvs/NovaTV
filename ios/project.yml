name: NovaTV
options:
  bundleIdPrefix: com.nova
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  VLCKit:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: 3.6.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  NovaTV:
    type: application
    platform: iOS
    sources:
      - path: NovaTV
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nova.tv
        PRODUCT_NAME: NovaTV
        INFOPLIST_FILE: NovaTV/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_PREVIEWS: "NO"
  NovaTVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NovaTVTests
    dependencies:
      - target: NovaTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nova.tv.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NovaTV.app/NovaTV"
schemes:
  NovaTV:
    build:
      targets:
        NovaTV: all
        NovaTVTests: [test]
    test:
      targets:
        - NovaTVTests
